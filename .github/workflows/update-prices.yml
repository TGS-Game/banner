# Fetches metal prices and saves them as prices.json on the gh-pages branch,
# served at https://tgs-game.github.io/banner/prices.json. The banner reads only
# that file; visitors' browsers never call metalpriceapi.
#
# Runs every 10 minutes (GitHub may start runs late, or skip some) and from the
# Actions tab: "Update prices" > "Run workflow". Needs the repository secret
# METALPRICE_API_KEY. Any failure fails the run and leaves the last good file.
#
# Scheduled runs only happen on the default branch (main), and GitHub turns the
# schedule off after 60 days without repository activity (re-enable it from the
# Actions tab).

name: Update prices

on:
  schedule:
    # Minute 4, 14, 24, ...: off the top of the hour, when GitHub is busiest.
    # Each run is 1 API call (2 once a day), so 145 a day.
    - cron: "4-59/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write # commit prices.json to gh-pages
  pages: write # ask GitHub Pages to rebuild

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the script
        uses: actions/checkout@v4
        with:
          path: tools
          sparse-checkout: scripts

      - name: Check out gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch prices
        env:
          METALPRICE_API_KEY: ${{ secrets.METALPRICE_API_KEY }}
        run: node tools/scripts/fetch-prices.mjs site/prices.json

      - name: Commit and push
        id: push
        working-directory: site
        run: |
          if git diff --quiet -- prices.json && git ls-files --error-unmatch prices.json >/dev/null 2>&1; then
            echo "Prices unchanged; nothing to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git commit -m "Update prices"
          git push origin HEAD:gh-pages
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # A push made with the built-in token does not start a Pages build by
      # itself, so ask for one.
      - name: Rebuild GitHub Pages
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds" --silent
